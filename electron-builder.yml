appId: com.novakpipeline.theshow
productName: The Show — Franchise Hockey Manager
copyright: © novak-pipeline

directories:
  output: release
  buildResources: build

# The shipped app has NO native modules (node-llama-cpp is excluded below;
# better-sqlite3 was dropped for JSON saves), so skip @electron/rebuild — it does
# nothing useful here and, on Windows, its pass over app.asar collides with
# antivirus/file-lock timing ("app.asar is being used by another process").
npmRebuild: false

# Ship the app as loose files instead of an app.asar archive. On this Windows box,
# antivirus real-time scanning locks the freshly-written app.asar exactly as
# electron-builder tries to finalize it ("being used by another process"), failing
# the build. No asar = no such file to lock. Auto-update (electron-updater) is
# unaffected; the only cost is a slightly larger, unpacked install tree.
asar: false

# electron-vite emits the app into out/ and EXTERNALIZES main-process deps
# (electron-updater is `import`ed, not bundled), so node_modules must ship too.
# electron-builder's default `**/*` includes out/ + production node_modules and
# auto-drops devDependencies; we only need to negate the source/config that would
# otherwise bloat the asar, and exclude the OPTIONAL native text-LLM writer
# (node-llama-cpp) — the game and neural VOICES (WASM, in the renderer bundle)
# work without it; the Feed writer just falls back to templates.
files:
  # Build OUTPUT dirs — never bundle a prior build INTO the app (this was silently
  # recursively including ~900MB of old win-unpacked trees). ~1.3GB saved with mods.
  - '!release'
  - '!standalone-build'
  - '!installer-out'
  - '!dist'
  # Dev/agent scaffolding — crucially `.claude/worktrees/` holds full chip clones,
  # each with its OWN release/win-unpacked build + node_modules (~900MB), which
  # electron-builder was recursively bundling INTO the app (and signtool then tried
  # to sign the nested exes). Never ship it.
  - '!.claude'
  # Mods & facepacks: a PACKAGED build reads these from <userData>/mods, never from
  # inside the app (see src/main/mods.ts), so the bundled copy is dead weight. To use
  # real rosters/faces in the standalone, drop the mods folder in <userData>/mods.
  - '!mods'
  # Source, tooling, and dev-only reference data (never needed at runtime; main
  # reads none of it). Dropping these alone saves ~200MB.
  - '!src'
  - '!scripts'
  - '!docs'
  - '!RnD'
  - '!build'
  - '!3D assets'
  - '!Images'
  - '!EHM.Editor.v1.3.3'
  - '!EHM.Editor.v1.3.3.zip'
  - '!References (dont publish)'
  - '!*.xlsx'
  - '!_diag.txt'
  - '!_nhl_sample.json'
  - '!**/*.{map,md,ts,tsx}'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{tsconfig.json,tsconfig.node.json,vitest.config.ts,.gitignore,.npmrc}'
  # The renderer BUNDLES its libraries into out/renderer (react, pixi, three,
  # kokoro, transformers + the ONNX WASM), so the node_modules copies are dead
  # weight — and onnxruntime-node is the NODE binding we never use (we run the
  # WASM/web path). Excluding these saves ~370MB.
  - '!node_modules/onnxruntime-node/**/*'
  - '!node_modules/onnxruntime-web/**/*'
  - '!node_modules/@huggingface/**/*'
  - '!node_modules/kokoro-js/**/*'
  - '!node_modules/pixi.js/**/*'
  - '!node_modules/three/**/*'
  - '!node_modules/gifuct-js/**/*'
  # Optional native text-LLM writer — excluded; the Feed falls back to templates.
  - '!node_modules/node-llama-cpp/**/*'
  - '!node_modules/@node-llama-cpp/**/*'

win:
  target: nsis
  artifactName: TheShow-Setup-${version}.${ext}

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  shortcutName: The Show

# Self-update feed: electron-updater reads latest.yml + the installer from the
# repo's GitHub Releases.
publish:
  provider: github
  owner: novak-pipeline
  repo: hockeymanager
